# Portainer stack: Repository, compose path docker-compose.yml.
services:
  homepage:
    build: .
    image: homepage:latest
    # Rebuild on every deploy, so "Pull and redeploy" picks up changes from GitHub
    pull_policy: build
    container_name: homepage
    restart: unless-stopped
    # No host port: plain HTTP on port 8080, only on the "proxy" network. Traefik there
    # terminates HTTPS and forwards to http://homepage:8080 (configured in Traefik).
    expose:
      - "8080"
    networks:
      - proxy
    environment:
      TZ: Europe/Oslo
      # Optional PIN code for editing the page. Leave empty for no PIN.
      EDIT_PIN: ${EDIT_PIN:-}
    volumes:
      # The app list edited on the page is saved here and survives redeploys.
      - /opt/homepage:/data

networks:
  proxy:
    external: true
