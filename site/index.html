<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Hjemme hos oss</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <svg class="house" viewBox="0 0 120 110" aria-hidden="true">
        <g class="smoke">
          <circle cx="86" cy="18" r="5"></circle>
          <circle cx="92" cy="8" r="4"></circle>
          <circle cx="99" cy="2" r="3"></circle>
        </g>
        <rect class="chimney" x="80" y="26" width="12" height="22" rx="2"></rect>
        <path class="walls" d="M22 56 60 24l38 32v40a8 8 0 0 1-8 8H30a8 8 0 0 1-8-8z"></path>
        <path class="roof" d="M14 58 60 18l46 40"></path>
        <rect class="window" x="34" y="62" width="18" height="16" rx="3"></rect>
        <path class="door" d="M66 104V80a8 8 0 0 1 16 0v24z"></path>
        <path class="heart" d="M43 74s-6-3.4-6-7.4a3.2 3.2 0 0 1 6-1.8 3.2 3.2 0 0 1 6 1.8c0 4-6 7.4-6 7.4z"></path>
      </svg>
      <div class="hero-text">
        <p class="greeting" id="greeting">Hei!</p>
        <h1 id="title">Hjemme hos oss</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
    </header>

    <div class="search-wrap">
      <label class="visually-hidden" for="search">Søk etter en app</label>
      <input id="search" type="search" placeholder="Hva leter du etter?" autocomplete="off" spellcheck="false">
      <kbd class="hint" aria-hidden="true">/</kbd>
    </div>

    <main id="apps" aria-live="polite"></main>
    <p class="empty" id="empty" hidden>Fant ingenting som heter det. Prøv et annet ord?</p>

    <footer class="footer">
      <span id="today"></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
